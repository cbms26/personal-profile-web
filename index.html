<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Website CBMS</title>

    <link rel="stylesheet" href="style.css" />
    <!-- Press Start 2P Font - Pixel Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!-- VT323 Font link -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />

    <!-- latest -->
    <link
      href="https://unpkg.com/nes.css@latest/css/nes.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Start Screen -->
    <div id="start-screen">
      <h1 class="start-title">Curious Coder CBMS</h1>
      <i class="nes-icon is-large star"></i>
      <i class="nes-icon is-large star"></i>
      <i class="nes-icon is-large star"></i>
      <p class="press-start" style="margin-top: 2rem">PRESS START</p>
      <button id="start-button" type="button" class="nes-btn is-primary">
        START
      </button>
    </div>

    <!-- Game World -->
    <div id="game-world" class="hidden">
      <!-- Header -->
      <header class="game-header">
        <div class="nes-container is-dark with-title">
          <p class="title">Hero: Ngawang Tenzin</p>
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <span>Level</span>
            <progress
              class="nes-progress is-success"
              value="28"
              max="100"
            ></progress>
            <div class="nes-badge">
              <!-- Level = Age -->
              <span class="is-warning">LVL 28</span>
            </div>
          </div>
          <button id="back-button" type="button" class="nes-btn is-error">
            Go back
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="game-main">
        <!-- Navigation -->
        <nav id="hero-stats-nav" class="nes-container is-dark with-title">
          <p class="title">Hero Stats</p>
          <!-- Mobile Hamburger Menu -->
          <div class="mobile-menu-toggle" id="mobile-menu-toggle">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <a
            href="#"
            class="nes-btn is-fullwidth map-location"
            data-section="about"
          >
            <i class="nes-icon star is-small"></i> Hero's Profile
          </a>
          <a
            href="#"
            class="nes-btn is-success is-fullwidth map-location"
            data-section="skills"
          >
            <i class="nes-icon star is-small"></i> Hero Skills
          </a>
          <a
            href="#"
            class="nes-btn is-primary is-fullwidth map-location"
            data-section="projects"
          >
            <i class="nes-icon trophy is-small"></i> Quest Log
          </a>
          <a
            href="#"
            class="nes-btn is-fullwidth map-location"
            data-section="experience"
          >
            <i class="nes-icon star is-small"></i> Journey
          </a>
          <a
            href="#"
            class="nes-btn is-warning is-fullwidth map-location"
            data-section="contact"
          >
            <i class="nes-icon gmail is-small"></i> Summon
          </a>
        </nav>

        <!-- Display Content -->
        <section
          id="content-display"
          class="nes-container with-title is-centered"
        >
          <p id="content-title" class="title">ADVENTURE AWAITS</p>
          <div id="text-content">
            <p>
              Select from <strong>Hero Stats</strong> to Learn More about this
              Hero!
            </p>
          </div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="game-footer">
        <p>
          © 2025 Ngawang Tenzin. All rights reserved.
          <i class="nes-icon heart"></i>
        </p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
