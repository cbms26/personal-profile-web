<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Website CBMS</title>

    <link rel="stylesheet" href="style.css" />
    <!-- Press Start 2P Font - Pixel Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!-- VT323 Font link -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />

    <!-- minified version -->
    <link
      href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Start Screen -->
    <div id="start-screen">
      <h1 class="start-title">Ngawang Tenzin's Portfolio</h1>
      <i class="nes-icon is-large star"></i>
      <i class="nes-icon is-large star"></i>
      <i class="nes-icon is-large star"></i>
      <p class="press-start" style="margin-top: 2rem">PRESS START</p>
      <button id="start-button" type="button" class="nes-btn is-primary">
        START
      </button>
    </div>

    <!-- Game World -->
    <div id="game-world" class="hidden">
      <!-- Header -->
      <header class="game-header">
        <div class="nes-container is-dark with-title">
          <p class="title">HERO: Ngawang Tenzin</p>
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <span>Level</span>
            <progress
              class="nes-progress is-success"
              value="28"
              max="100"
            ></progress>
            <div class="nes-badge">
              <span class="is-warning">LVL 28</span>
            </div>
          </div>
          <button id="back-button" type="button" class="nes-btn is-secondary">
            Go back
          </button>
        </div>
      </header>

      <!-- Main Content -->
    </div>

    <script src="./script.js"></script>
  </body>
</html>
